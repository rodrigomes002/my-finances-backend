version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: myfinances-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: myfinancesdb
      POSTGRES_DB: myfinancesdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - myfinances-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: myfinances-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_NAME: myfinancesdb
      DB_PASSWORD: myfinancesdb
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/myfinancesdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: myfinancesdb
    ports:
      - "8080:8080"
    networks:
      - myfinances-network

volumes:
  postgres_data:

networks:
  myfinances-network:
    driver: bridge
